<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investing Principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#1a1a2e;
  --ink2:#2d2d4a;
  --ink3:#3d3d5c;
  --cream:#f0ead6;
  --cream2:#e8e0c8;
  --cream3:#d4c9a8;
  --gold:#d4a843;
  --gold-dim:rgba(212,168,67,0.15);
  --green:#4a9572;
  --green-dim:rgba(74,149,114,0.15);
  --red:#c24b4b;
  --red-dim:rgba(194,75,75,0.12);
  --blue:#4a7db5;
  --blue-dim:rgba(74,125,181,0.12);
  --amber:#c47d2a;
  --amber-dim:rgba(196,125,42,0.12);
  --border:rgba(240,234,214,0.1);
  --border2:rgba(240,234,214,0.18);
  --radius:14px;
}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--ink);
  color:var(--cream);
  min-height:100vh;
  line-height:1.6;
}

/* ── Topbar ── */
.topbar{
  background:rgba(26,26,46,0.95);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border2);
  padding:0 20px;
  height:54px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:50;
}
.tb-back{
  background:none;border:none;cursor:pointer;
  font-size:19px;color:rgba(240,234,214,0.5);padding:4px;
  border-radius:6px;line-height:1;display:flex;align-items:center;
  transition:color .15s;
}
.tb-back:hover{color:var(--cream);}
.tb-title{font-family:'DM Serif Display',serif;font-size:16px;color:var(--cream);flex:1;}
.tb-count{font-size:11px;color:rgba(240,234,214,0.4);font-family:'DM Mono',monospace;}

/* ── Hero ── */
.hero{
  padding:48px 24px 36px;
  max-width:1000px;
  margin:0 auto;
  text-align:center;
}
.hero-eyebrow{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.hero-eyebrow::before,.hero-eyebrow::after{
  content:'';width:40px;height:1px;background:var(--gold);opacity:.4;
}
.hero-title{
  font-family:'DM Serif Display',serif;
  font-size:clamp(28px,5vw,44px);
  color:var(--cream);
  line-height:1.15;
  margin-bottom:14px;
}
.hero-title em{
  font-style:italic;
  color:var(--gold);
}
.hero-sub{
  font-size:14px;
  color:rgba(240,234,214,0.55);
  max-width:480px;
  margin:0 auto;
  line-height:1.7;
}

/* ── Filter bar ── */
.filter-bar{
  display:flex;
  gap:6px;
  justify-content:center;
  flex-wrap:wrap;
  padding:0 20px 28px;
}
.fb{
  padding:5px 14px;
  border-radius:20px;
  border:1px solid var(--border2);
  background:none;
  font-size:12px;
  color:rgba(240,234,214,0.5);
  cursor:pointer;
  transition:all .2s;
  font-family:'DM Sans',sans-serif;
}
.fb:hover{color:var(--cream);border-color:rgba(240,234,214,0.3);}
.fb.active{color:var(--ink);font-weight:500;}
.fb-all.active{background:var(--cream);border-color:var(--cream);}
.fb-buffett.active{background:var(--gold);border-color:var(--gold);}
.fb-risk.active{background:var(--red);border-color:var(--red);}
.fb-mindset.active{background:var(--green);border-color:var(--green);}
.fb-japan.active{background:var(--blue);border-color:var(--blue);}

/* ── Grid ── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:12px;
  padding:0 20px 60px;
  max-width:1040px;
  margin:0 auto;
}

/* ── Principle card ── */
.pc{
  background:var(--ink2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  position:relative;
}
.pc:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
  border-color:var(--border2);
}
.pc.open{
  border-color:var(--pc-accent,var(--gold));
  box-shadow:0 0 0 1px var(--pc-accent,var(--gold));
}

/* Card top stripe */
.pc-stripe{
  height:3px;
  width:100%;
}

/* Card visual area */
.pc-visual{
  padding:20px 20px 0;
  display:flex;
  align-items:flex-start;
  gap:14px;
}
.pc-number{
  font-family:'DM Serif Display',serif;
  font-size:48px;
  line-height:1;
  opacity:.12;
  flex-shrink:0;
  letter-spacing:-.02em;
  user-select:none;
}
.pc-icon-wrap{
  width:52px;height:52px;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}

/* Card content */
.pc-content{padding:14px 18px 16px;}
.pc-tag{
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:7px;
  opacity:.6;
}
.pc-title{
  font-family:'DM Serif Display',serif;
  font-size:18px;
  color:var(--cream);
  line-height:1.25;
  margin-bottom:8px;
}
.pc-quote{
  font-size:12px;
  color:rgba(240,234,214,0.45);
  line-height:1.6;
  font-style:italic;
  padding-left:10px;
  border-left:2px solid;
  margin-bottom:10px;
}
.pc-mm-preview{
  font-size:12px;
  color:rgba(240,234,214,0.55);
  line-height:1.55;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* Expanded drawer */
.pc-drawer{
  display:none;
  border-top:1px solid var(--border);
  padding:14px 18px 16px;
  background:rgba(0,0,0,0.2);
}
.pc-drawer.open{display:block;}
.pc-en{
  font-size:13px;
  color:rgba(240,234,214,0.75);
  line-height:1.75;
  margin-bottom:12px;
}
.pc-mm-full{
  font-size:12px;
  color:rgba(240,234,214,0.55);
  line-height:1.7;
  padding:10px 12px;
  background:rgba(255,255,255,0.04);
  border-radius:8px;
  margin-bottom:10px;
}
.pc-lesson{
  font-size:12px;
  line-height:1.65;
  padding:9px 12px;
  border-radius:0 8px 8px 0;
  border-left:3px solid;
}
.pc-lesson-lbl{
  font-size:9px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:4px;
  opacity:.7;
}
.pc-chevron{
  position:absolute;
  bottom:14px;right:16px;
  font-size:15px;
  color:rgba(240,234,214,0.3);
  transition:transform .2s;
}
.pc.open .pc-chevron{transform:rotate(180deg);}

/* ── Mobile ── */
@media(max-width:560px){
  .grid{grid-template-columns:1fr;padding:0 14px 40px;}
  .hero{padding:32px 14px 24px;}
  .filter-bar{padding:0 14px 20px;}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="tb-back" onclick="history.back()" aria-label="Back">
    <i class="ti ti-arrow-left"></i>
  </button>
  <div class="tb-title">Investing Principles</div>
  <span class="tb-count" id="tb-count">— principles</span>
</div>

<div class="hero">
  <div class="hero-eyebrow">Timeless wisdom</div>
  <h1 class="hero-title">Rules that survive<br><em>every market cycle</em></h1>
  <p class="hero-sub">Buffett, Graham, and classic Japanese market wisdom — the principles behind every good decision.</p>
</div>

<div class="filter-bar">
  <button class="fb fb-all active" onclick="filter('all',this)">All</button>
  <button class="fb fb-buffett" onclick="filter('buffett',this)">Buffett</button>
  <button class="fb fb-risk" onclick="filter('risk',this)">Risk</button>
  <button class="fb fb-mindset" onclick="filter('mindset',this)">Mindset</button>
  <button class="fb fb-japan" onclick="filter('japan',this)">Japan</button>
</div>

<div class="grid" id="grid"></div>

// ── Filter & render ───────────────────────────────────────────
var activeTag = 'all';

function filter(tag, btn){
  activeTag = tag;
  document.querySelectorAll('.fb').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  render();
}

function render(){
  var items = activeTag === 'all'
    ? PRINCIPLES
    : PRINCIPLES.filter(function(p){ return p.tag === activeTag; });

  document.getElementById('tb-count').textContent = items.length + ' principles';

  var html = '';
  items.forEach(function(p){
    var isOpen = OPEN === p.id;
    html += '<div class="pc'+(isOpen?' open':'')+'" id="pc-'+p.id+'" onclick="toggle(\''+p.id+'\')" style="--pc-accent:'+p.accent+';">'
          + '<div class="pc-stripe" style="background:'+p.accent+';"></div>'
          + '<div class="pc-visual">'
          +   '<div class="pc-number" style="color:'+p.accent+'">'+p.num+'</div>'
          +   '<div class="pc-icon-wrap" style="background:'+p.accentDim+';">'+p.icon+'</div>'
          + '</div>'
          + '<div class="pc-content">'
          +   '<div class="pc-tag" style="color:'+p.accent+'">'+p.tag+' principle</div>'
          +   '<div class="pc-title">'+p.title+'</div>'
          +   '<div class="pc-quote" style="border-color:'+p.accent+';">'+p.quote+'</div>'
          +   '<div class="pc-mm-preview">'+p.mm_preview+'</div>'
          + '</div>'
          + '<div class="pc-drawer'+(isOpen?' open':'')+'">'
          +   '<div class="pc-en">'+p.exp_en+'</div>'
          +   '<div class="pc-mm-full">'+p.exp_mm+'</div>'
          +   '<div class="pc-lesson" style="background:'+p.accentDim+';border-color:'+p.accent+';color:'+p.accent+';">'
          +     '<div class="pc-lesson-lbl">Action / Lesson</div>'
          +     p.lesson+'<br><br>'
          +     '<span style="opacity:.7;font-style:italic;font-size:11px;">'+p.lesson_mm+'</span>'
          +   '</div>'
          + '</div>'
          + '<i class="ti ti-chevron-down pc-chevron'+(isOpen?' open':'')+'" aria-hidden="true"></i>'
          + '</div>';
  });
  document.getElementById('grid').innerHTML = html;
}

function toggle(id){
  OPEN = (OPEN === id) ? null : id;
  render();
  if(OPEN){
    var el = document.getElementById('pc-'+id);
    if(el) setTimeout(function(){ el.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 50);
  }
}

// ── Init ─────────────────────────────────────────────────────
render();
</script>
