<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan TSE Sector Map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f5f3;--surface:#fff;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#1a1a1a;--text2:#555;--text3:#999;--radius:12px;
  --def:#185FA5;--def-bg:#E6F1FB;--def-t:#0C447C;
  --cyc:#993C1D;--cyc-bg:#FAECE7;--cyc-t:#712B13;
  --gro:#3B6D11;--gro-bg:#EAF3DE;--gro-t:#27500A;
  --fin:#534AB7;--fin-bg:#EEEDFE;--fin-t:#3C3489;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── Topbar ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
.tb-back{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text2);padding:4px;border-radius:6px;line-height:1;display:flex;align-items:center;transition:background .15s;}
.tb-back:hover{background:var(--bg);}
.tb-title{font-size:15px;font-weight:600;flex:1;}
.tb-sub{font-size:11px;color:var(--text3);}

/* ── Page layout ── */
.page{padding:18px;}

/* ── Legend ── */
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.leg{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12px;cursor:pointer;transition:all .15s;color:var(--text2);}
.leg:hover{border-color:var(--border2);}
.leg.active-def{background:var(--def-bg);color:var(--def-t);border-color:rgba(24,95,165,.25);}
.leg.active-cyc{background:var(--cyc-bg);color:var(--cyc-t);border-color:rgba(153,60,29,.25);}
.leg.active-gro{background:var(--gro-bg);color:var(--gro-t);border-color:rgba(59,109,17,.25);}
.leg.active-fin{background:var(--fin-bg);color:var(--fin-t);border-color:rgba(83,74,183,.25);}
.leg.active-all{background:var(--surface);color:var(--text);border-color:var(--border2);font-weight:500;}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ── Cycle strip ── */
.cycle-wrap{margin-bottom:20px;}
.cycle-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:10px;}
.cycle-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.cycle-phase{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;}
.cycle-phase:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.cycle-phase.selected{border-color:var(--ph-color,#185FA5);box-shadow:0 0 0 2px var(--ph-color,#185FA5) inset;}
.cp-num{font-size:22px;font-weight:700;opacity:.12;position:absolute;top:8px;right:10px;font-variant-numeric:tabular-nums;}
.cp-phase{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.cp-name{font-size:14px;font-weight:600;margin-bottom:4px;}
.cp-desc{font-size:11px;color:var(--text3);line-height:1.5;}
.cp-mm{font-size:11px;color:var(--text3);margin-top:3px;font-style:italic;}
.cp-sectors{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px;}
.cp-sector-tag{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;}

/* ── Sectors grid ── */
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.sec-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;}
.sec-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.07);}
.sec-card.selected{box-shadow:0 0 0 2px var(--sc-color) inset;border-color:var(--sc-color);}
.sec-card.dimmed{opacity:.35;}
.sc-top{padding:12px 14px 0;}
.sc-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.sc-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sc-right{flex:1;}
.sc-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;}
.sc-jp{font-size:10px;color:var(--text3);margin-top:1px;}
.sc-type{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;display:inline-block;margin-top:4px;}
.sc-examples{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 10px;}
.sc-ex{font-size:10px;background:var(--bg);border:1px solid var(--border);padding:2px 6px;border-radius:4px;color:var(--text3);}
.sc-strip{height:3px;width:100%;}
.sc-phases{display:flex;gap:3px;padding:6px 14px 10px;flex-wrap:wrap;}
.sc-ph{font-size:9px;padding:2px 6px;border-radius:20px;font-weight:500;}

/* ── Drawer ── */
.drawer-wrap{margin-top:10px;}
.drawer{display:none;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}
.drawer.open{display:grid;grid-template-columns:1fr 1fr;}
.dw-left{padding:18px 20px;border-right:1px solid var(--border);}
.dw-right{padding:18px 20px;}
.dw-close{float:right;background:none;border:none;font-size:18px;color:var(--text3);cursor:pointer;line-height:1;}
.dw-close:hover{color:var(--text);}
.dw-name{font-size:19px;font-weight:700;margin-bottom:3px;}
.dw-jp{font-size:11px;color:var(--text3);margin-bottom:10px;}
.dw-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px;margin-top:12px;}
.dw-lbl:first-of-type{margin-top:0;}
.dw-text{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:6px;}
.dw-mm{font-size:12px;color:var(--text3);line-height:1.65;font-style:italic;background:var(--bg);border-radius:7px;padding:8px 11px;margin-bottom:8px;}
.dw-tip{font-size:12px;background:#FAEEDA;border-left:3px solid #EF9F27;padding:8px 11px;border-radius:0 6px 6px 0;color:#633806;line-height:1.6;margin-bottom:4px;}
.dw-tip-mm{font-size:11px;background:#FAEEDA;border-left:3px solid #EF9F27;padding:6px 11px;border-radius:0 6px 6px 0;color:#854F0B;line-height:1.6;font-style:italic;}
.dw-stocks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.dw-stock{font-size:11px;background:var(--bg);border:1px solid var(--border);padding:3px 8px;border-radius:6px;color:var(--text2);}
.phase-matrix{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.pm-cell{padding:9px 10px;border-radius:8px;border:1px solid var(--border);}
.pm-ph{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.pm-rating{font-size:15px;font-weight:700;}
.pm-note{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.4;}
.mark-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:var(--bg);font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s;margin-top:12px;}
.mark-btn:hover{background:rgba(59,109,17,.08);}
.mark-btn.on{background:#EAF3DE;color:#3B6D11;border-color:rgba(59,109,17,.2);}

/* ── Section label ── */
.grp-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:10px;margin-top:20px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.grp-lbl:first-child{margin-top:0;}

@media(max-width:600px){
  .cycle-strip{grid-template-columns:repeat(2,1fr);}
  .sec-grid{grid-template-columns:1fr 1fr;}
  .drawer.open{grid-template-columns:1fr;}
  .dw-left{border-right:none;border-bottom:1px solid var(--border);}
  .page{padding:14px;}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="tb-back" onclick="history.back()" aria-label="Back"><i class="ti ti-arrow-left"></i></button>
  <div>
    <div class="tb-title">Japan TSE Sector Map</div>
    <div class="tb-sub">東証セクター — tap a phase or sector to explore</div>
  </div>
</div>

<div class="page">

  <!-- Legend -->
  <div class="legend">
    <div class="leg active-all" onclick="filterType('all',this)"><div class="leg-dot" style="background:#888;"></div>All sectors</div>
    <div class="leg" onclick="filterType('defensive',this)"><div class="leg-dot" style="background:var(--def);"></div>Defensive</div>
    <div class="leg" onclick="filterType('cyclical',this)"><div class="leg-dot" style="background:var(--cyc);"></div>Cyclical</div>
    <div class="leg" onclick="filterType('growth',this)"><div class="leg-dot" style="background:var(--gro);"></div>Growth</div>
    <div class="leg" onclick="filterType('financial',this)"><div class="leg-dot" style="background:var(--fin);"></div>Financial / Rate sensitive</div>
  </div>

  <!-- Economic cycle phases -->
  <div class="cycle-wrap">
    <div class="cycle-lbl">Economic cycle — tap a phase to highlight which sectors do well</div>
    <div class="cycle-strip" id="cycle-strip"></div>
  </div>

  <!-- Drawer for sector detail -->
  <div class="drawer-wrap"><div class="drawer" id="main-drawer"></div></div>

  <!-- Sectors grid -->
  <div id="sectors-body"></div>

</div>

var SECTORS=[

  PHASES.forEach(function(ph){
    var col=PHASE_COLORS[ph.id];
    var sel=S.phaseFilter===ph.id?' selected':'';
    var tagHtml=ph.sectors.map(function(s){
      var sec=SECTORS.find(function(x){return x.id===s;});
      if(!sec)return'';
      var tc=TYPE_COLORS[sec.type];
      return'<span class="cp-sector-tag" style="background:'+tc.bg+';color:'+tc.text+';">'+sec.name+'</span>';
    }).join('');
    html+='<div class="cycle-phase'+sel+'" style="--ph-color:'+ph.color+';" onclick="togglePhase(\''+ph.id+'\')">'
        +'<div class="cp-num">'+ph.num+'</div>'
        +'<div class="cp-phase" style="color:'+ph.color+'">'+ph.phase+'</div>'
        +'<div class="cp-name">'+ph.name+' / '+ph.jp+'</div>'
        +'<div class="cp-desc">'+ph.desc+'</div>'
        +'<div class="cp-mm">'+ph.desc_mm+'</div>'
        +'<div class="cp-sectors">'+tagHtml+'</div>'
        +'</div>';
  });
  document.getElementById('cycle-strip').innerHTML=html;
}

function togglePhase(id){
  S.phaseFilter=S.phaseFilter===id?null:id;
  renderCycle();
  renderSectors();
}

// ════════════════════════════════════════════════
//  RENDER SECTORS
// ════════════════════════════════════════════════
var GROUPS2=[
  {key:'defensive',label:'Defensive — stable in all conditions'},
  {key:'cyclical', label:'Cyclical — follow the economic cycle'},
  {key:'growth',   label:'Growth & Resources'},
  {key:'financial',label:'Financial & Rate sensitive'},
];

function getSectorPhaseRating(sec,phaseId){
  var ph=PHASES.find(function(x){return x.id===phaseId;});
  if(!ph) return null;
  return ph.best.indexOf(sec.type)>-1?'good':'neutral';
}

function renderSectors(){
  var body=document.getElementById('sectors-body');
  var activePhase=S.phaseFilter?PHASES.find(function(p){return p.id===S.phaseFilter;}):null;
  var html='';

  GROUPS2.forEach(function(g,gi){
    var list=SECTORS.filter(function(s){return s.type===g.key;});
    if(S.typeFilter!=='all'&&S.typeFilter!==g.key) return;

    html+='<div class="grp-lbl">'+g.label+'</div>';
    html+='<div class="drawer-wrap" id="dw-'+gi+'"><div class="drawer" id="dr-'+gi+'"></div></div>';
    html+='<div class="sec-grid">';

    list.forEach(function(sec){
      var tc=TYPE_COLORS[sec.type];
      var dimmed=activePhase&&activePhase.best.indexOf(sec.type)===-1;
      var sel=S.openId===sec.id?' selected':'';
      var isL=!!S.learned[sec.id];
      // Phase ratings bar
      var phaseHtml=PHASES.map(function(ph){
        var rating=sec.phases[ph.id]||'★';
        var highlight=S.phaseFilter===ph.id;
        var phc=PHASE_COLORS[ph.id];
        return'<span class="sc-ph" style="background:'+(highlight?phc.bg:'var(--bg)')+';color:'+(highlight?phc.text:'var(--text3)')+';">'+ph.name+' '+rating+'</span>';
      }).join('');
      html+='<div class="sec-card'+sel+(dimmed?' dimmed':'')+'" id="sc-'+sec.id+'" onclick="openSector(\''+sec.id+'\','+gi+')" style="--sc-color:'+tc.dot+';">'
          +'<div class="sc-strip" style="background:'+tc.bar+';"></div>'
          +'<div class="sc-top">'
          +  '<div class="sc-head">'
          +    '<div class="sc-icon" style="background:'+tc.bg+'"><i class="ti '+sec.icon+'" style="font-size:17px;color:'+tc.dot+';" aria-hidden="true"></i></div>'
          +    '<div class="sc-right">'
          +      '<div class="sc-name">'+sec.name+'</div>'
          +      '<div class="sc-jp">'+sec.jp+'</div>'
          +      '<span class="sc-type" style="background:'+tc.bg+';color:'+tc.text+';">'+TYPE_COLORS[sec.type].label+'</span>'
          +      (isL?'<div class="ic-lrn show" style="display:block;font-size:10px;color:var(--gro);margin-top:3px;">✓ learned</div>':'')
          +    '</div>'
          +  '</div>'
          +'</div>'
          +'<div class="sc-phases">'+phaseHtml+'</div>'
          +'<div class="sc-examples">'+sec.examples.map(function(e){return'<span class="sc-ex">'+e+'</span>';}).join('')+'</div>'
          +'</div>';
    });
    html+='</div>';
  });
  body.innerHTML=html;
}

// ════════════════════════════════════════════════
//  SECTOR DRAWER
// ════════════════════════════════════════════════
function openSector(id,gi){
  var sec=SECTORS.find(function(x){return x.id===id;});
  if(!sec) return;
  if(S.openId===id){
    S.openId=null;
    closeAllDrawers();
    document.querySelectorAll('.sec-card').forEach(function(c){c.classList.remove('selected');});
    return;
  }
  S.openId=id;
  closeAllDrawers();
  document.querySelectorAll('.sec-card').forEach(function(c){c.classList.remove('selected');});
  var card=document.getElementById('sc-'+id);
  if(card) card.classList.add('selected');

  var tc=TYPE_COLORS[sec.type];
  var isL=!!S.learned[id];

  // Phase matrix
  var pmHtml='<div class="phase-matrix">';
  PHASES.forEach(function(ph){
    var rating=sec.phases[ph.id]||'★';
    var note=sec.phase_notes[ph.id]||'';
    var phc=PHASE_COLORS[ph.id];
    pmHtml+='<div class="pm-cell" style="background:'+phc.bg+';border-color:rgba(0,0,0,.06);">'
          +'<div class="pm-ph" style="color:'+phc.text+';">'+ph.name+'</div>'
          +'<div class="pm-rating" style="color:'+phc.text+';">'+rating+'</div>'
          +'<div class="pm-note">'+note+'</div>'
          +'</div>';
  });
  pmHtml+='</div>';

  var drawer=document.getElementById('dr-'+gi);
  if(!drawer) return;
  drawer.innerHTML=
    '<div class="dw-left">'
    +  '<button class="dw-close" onclick="closeAllDrawers(event)" aria-label="Close"><i class="ti ti-x"></i></button>'
    +  '<div class="dw-name" style="color:'+tc.dot+'">'+sec.name+'</div>'
    +  '<div class="dw-jp">'+sec.jp+'</div>'
    +  '<div class="dw-lbl">Overview</div>'
    +  '<div class="dw-text">'+sec.exp_en+'</div>'
    +  '<div class="dw-mm">'+sec.exp_mm+'</div>'
    +  '<div class="dw-lbl">Tip</div>'
    +  '<div class="dw-tip">'+sec.tip_en+'</div>'
    +  '<div class="dw-tip-mm">'+sec.tip_mm+'</div>'
    +  '<div class="dw-lbl">Key stocks</div>'
    +  '<div class="dw-stocks">'+sec.examples.map(function(e){return'<span class="dw-stock">'+e+'</span>';}).join('')+'</div>'
    +  '<button class="mark-btn '+(isL?'on':'')+'" onclick="toggleL(event,\''+id+'\')">'
    +    '<i class="ti '+(isL?'ti-circle-check':'ti-circle')+'" style="font-size:14px;" aria-hidden="true"></i>'
    +    (isL?'Learned':'Mark as learned')
    +  '</button>'
    +'</div>'
    +'<div class="dw-right">'
    +  '<div class="dw-lbl">Performance by economic cycle phase</div>'
    +  pmHtml
    +'</div>';

  drawer.className='drawer open';
  var dw=document.getElementById('dw-'+gi);
  if(dw) setTimeout(function(){dw.scrollIntoView({behavior:'smooth',block:'nearest'});},60);
}

function closeAllDrawers(e){
  if(e) e.stopPropagation();
  S.openId=null;
  document.querySelectorAll('.drawer').forEach(function(d){d.className='drawer';d.innerHTML='';});
  document.querySelectorAll('.sec-card').forEach(function(c){c.classList.remove('selected');});
}

function toggleL(e,id){
  e.stopPropagation();
  S.learned[id]=!S.learned[id];
  saveL();
  renderSectors();
  var sec=SECTORS.find(function(x){return x.id===id;});
  if(sec){
    var gi=GROUPS2.findIndex(function(g){return g.key===sec.type;});
    if(gi>=0) setTimeout(function(){openSector(id,gi);},40);
  }
}

// ════════════════════════════════════════════════
//  TYPE FILTER
// ════════════════════════════════════════════════
function filterType(t,el){
  S.typeFilter=t; S.openId=null;
  document.querySelectorAll('.leg').forEach(function(l){
    l.className='leg';
  });
  var classMap={all:'active-all',defensive:'active-def',cyclical:'active-cyc',growth:'active-gro',financial:'active-fin'};
  if(el) el.className='leg '+(classMap[t]||'active-all');
  renderSectors();
}

// ════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════
renderCycle();
renderSectors();
</script>
</body>
</html>
