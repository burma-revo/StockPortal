<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candle Patterns</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f5f3;--surface:#fff;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#1a1a1a;--text2:#555;--text3:#999;--radius:12px;
  --g:#3B6D11;--g-bg:#EAF3DE;--g-t:#27500A;
  --a:#854F0B;--a-bg:#FAEEDA;--a-t:#633806;
  --r:#A32D2D;--r-bg:#FCEBEB;--r-t:#791F1F;
  --b:#185FA5;--b-bg:#E6F1FB;--b-t:#0C447C;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── Topbar ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
.tb-back{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text2);padding:4px;border-radius:6px;line-height:1;display:flex;align-items:center;transition:background .15s;}
.tb-back:hover{background:var(--bg);}
.tb-title{font-size:15px;font-weight:600;flex:1;}
.tb-sub{font-size:11px;color:var(--text3);}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.tb-search{position:relative;display:flex;align-items:center;}
.tb-search input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px 6px 30px;font-size:13px;color:var(--text);outline:none;width:160px;transition:border .2s;}
.tb-search input:focus{border-color:rgba(0,0,0,.2);}
.tb-search .si{position:absolute;left:9px;font-size:14px;color:var(--text3);pointer-events:none;}

/* ── Tab bar ── */
.tabbar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:0;}
.tab{flex:1;padding:12px 10px;text-align:center;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--g);border-bottom-color:var(--g);}

/* ── Pages ── */
.tab-page{display:none;padding:18px;}
.tab-page.active{display:block;}

/* ══ ANATOMY PAGE ══════════════════════════════════════════ */
.anatomy-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;max-width:800px;margin:0 auto;}
.candle-stage{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;align-items:center;}
.candle-stage-lbl{font-size:12px;color:var(--text3);margin-bottom:16px;text-align:center;}
.part-info-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;min-height:320px;display:flex;flex-direction:column;}
.pip-idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);text-align:center;gap:8px;}
.pip-idle i{font-size:32px;}
.pip-idle p{font-size:13px;}
.pip-content{display:none;}
.pip-content.show{display:block;}
.pip-name{font-size:20px;font-weight:700;margin-bottom:4px;}
.pip-jp{font-size:12px;color:var(--text3);margin-bottom:12px;}
.pip-en{font-size:13px;line-height:1.75;color:var(--text2);margin-bottom:10px;}
.pip-mm{font-size:12px;line-height:1.7;color:var(--text3);background:var(--bg);border-radius:8px;padding:10px 12px;font-style:italic;margin-bottom:10px;}
.pip-tip{font-size:12px;background:var(--a-bg);border-left:3px solid #EF9F27;padding:8px 11px;border-radius:0 6px 6px 0;color:var(--a-t);line-height:1.6;}

/* Part selector pills */
.part-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;}
.pp{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s;}
.pp:hover{border-color:var(--border2);color:var(--text);}
.pp.active{font-weight:500;}

/* Toggle between bull/bear candle */
.candle-toggle{display:flex;gap:6px;margin-bottom:14px;}
.ct-btn{flex:1;padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:none;font-size:12px;cursor:pointer;transition:all .15s;color:var(--text2);}
.ct-btn.bull.active{background:var(--g-bg);color:var(--g-t);border-color:rgba(59,109,17,.25);}
.ct-btn.bear.active{background:var(--r-bg);color:var(--r-t);border-color:rgba(163,45,45,.25);}

/* ══ PATTERN GALLERY PAGE ══════════════════════════════════ */
.gf-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.gfb{padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;}
.gfb:hover{background:var(--bg);}
.gfb.fa{background:var(--surface);color:var(--text);border-color:var(--border2);font-weight:500;}
.gfb.fbull{background:var(--g-bg);color:var(--g-t);border-color:rgba(59,109,17,.2);}
.gfb.fbear{background:var(--r-bg);color:var(--r-t);border-color:rgba(163,45,45,.2);}
.gfb.fneutral{background:var(--a-bg);color:var(--a-t);border-color:rgba(133,79,11,.2);}

.sec-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.pat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:4px;}

.pat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;}
.pat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.07);}
.pat-card.selected{box-shadow:0 0 0 2px var(--pc-sel) inset;border-color:var(--pc-sel);}
.pat-card.bull{border-top:2px solid var(--g);}
.pat-card.bear{border-top:2px solid var(--r);}
.pat-card.neutral{border-top:2px solid var(--a);}
.pc-svg{background:#f8f8f6;padding:14px;display:flex;align-items:center;justify-content:center;min-height:90px;}
.pc-info{padding:8px 10px;}
.pc-badges{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;}
.pcb{font-size:10px;padding:2px 6px;border-radius:20px;font-weight:500;}
.pc-en{font-size:12px;font-weight:600;line-height:1.3;}
.pc-jp{font-size:10px;color:var(--text3);margin-top:1px;}
.pc-lrn{font-size:10px;color:var(--g);margin-top:2px;display:none;}
.pc-lrn.show{display:block;}

/* Drawer */
.pat-drawer{display:none;grid-column:1/-1;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;margin-bottom:6px;}
.pat-drawer.open{display:grid;grid-template-columns:220px 1fr;}
.pdw-vis{background:#f8f8f6;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--border);}
.pdw-body{padding:18px 20px;overflow:auto;}
.pdw-close{float:right;background:none;border:none;font-size:18px;color:var(--text3);cursor:pointer;line-height:1;}
.pdw-close:hover{color:var(--text);}
.pdw-jp{font-size:11px;color:var(--text3);margin-bottom:2px;}
.pdw-en{font-size:19px;font-weight:700;line-height:1.2;margin-bottom:6px;}
.pdw-mm{font-size:12px;color:var(--text2);line-height:1.35;margin-bottom:8px;}
.pdw-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.pdw-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px;}
.pdw-exp{font-size:13px;color:var(--text2);line-height:1.75;margin-bottom:8px;}
.pdw-exp-mm{font-size:12px;color:var(--text3);line-height:1.7;background:var(--bg);border-radius:7px;padding:8px 11px;margin-bottom:8px;font-style:italic;}
.pdw-tip{font-size:12px;background:var(--a-bg);border-left:3px solid #EF9F27;padding:8px 11px;border-radius:0 6px 6px 0;color:var(--a-t);line-height:1.6;margin-bottom:4px;}
.pdw-tip-mm{font-size:11px;background:var(--a-bg);border-left:3px solid #EF9F27;padding:6px 11px;border-radius:0 6px 6px 0;color:var(--a-t);line-height:1.6;font-style:italic;margin-bottom:10px;}
.mark-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:var(--bg);font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s;}
.mark-btn:hover{background:rgba(59,109,17,.08);}
.mark-btn.on{background:var(--g-bg);color:var(--g);border-color:rgba(59,109,17,.2);}
.pdw-vis-lbl{font-size:10px;color:var(--text3);margin-top:8px;text-align:center;}

@media(max-width:620px){
  .anatomy-wrap{grid-template-columns:1fr;}
  .pat-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  .pat-drawer.open{grid-template-columns:1fr;}
  .pdw-vis{border-right:none;border-bottom:1px solid var(--border);}
  .tab-page{padding:14px;}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="tb-back" onclick="history.back()" aria-label="Back"><i class="ti ti-arrow-left"></i></button>
  <div>
    <div class="tb-title">Candlestick</div>
    <div class="tb-sub">Anatomy + 20 patterns</div>
  </div>
  <div class="tb-right" id="tb-right"></div>
</div>

<!-- Tab bar -->
<div class="tabbar">
  <div class="tab active" onclick="switchTab('anatomy',this)"><i class="ti ti-info-circle" style="font-size:14px;vertical-align:-1px;" aria-hidden="true"></i> Anatomy</div>
  <div class="tab" onclick="switchTab('patterns',this)"><i class="ti ti-candle" style="font-size:14px;vertical-align:-1px;" aria-hidden="true"></i> 20 Patterns</div>
</div>

<!-- ══ TAB: ANATOMY ══════════════════════════════════════════ -->
<div class="tab-page active" id="tab-anatomy">
  <div class="anatomy-wrap">

    <!-- Left: candle diagram -->
    <div class="candle-stage">
      <div class="candle-stage-lbl">Tap a part of the candle — or use the buttons below</div>
      <div class="candle-toggle">
        <button class="ct-btn bull active" id="btn-bull" onclick="setCandleType('bull')">Bullish (Green)</button>
        <button class="ct-btn bear" id="btn-bear" onclick="setCandleType('bear')">Bearish (Red)</button>
      </div>
      <!-- SVG anatomy diagram -->
      <div id="anatomy-svg-wrap"></div>
      <!-- Part selector pills -->
      <div class="part-pills" id="part-pills"></div>
    </div>

    <!-- Right: part info -->
    <div class="part-info-panel" id="part-info">
      <div class="pip-idle" id="pip-idle">
        <i class="ti ti-hand-click" aria-hidden="true"></i>
        <p>Tap any part of the candle<br>or a button below to learn what it means</p>
      </div>
      <div class="pip-content" id="pip-content">
        <div class="pip-name" id="pip-name"></div>
        <div class="pip-jp" id="pip-jp"></div>
        <div class="pip-en" id="pip-en"></div>
        <div class="pip-mm" id="pip-mm"></div>
        <div class="pip-tip" id="pip-tip"></div>
      </div>
    </div>

  </div>
</div>

<!-- ══ TAB: PATTERNS ════════════════════════════════════════ -->
<div class="tab-page" id="tab-patterns">
  <div class="gf-bar">
    <button class="gfb fa" onclick="setPatFilter('all',this)">All</button>
    <button class="gfb" onclick="setPatFilter('bullish',this)">Bullish</button>
    <button class="gfb" onclick="setPatFilter('bearish',this)">Bearish</button>
    <button class="gfb" onclick="setPatFilter('neutral',this)">Neutral</button>
    <button class="gfb" onclick="setPatFilter('reversal',this)">Reversal</button>
    <button class="gfb" onclick="setPatFilter('continuation',this)">Continuation</button>
  </div>
  <div id="patterns-body"></div>
</div>

<script>
// ════════════════════════════════════════════════
//  SVG ENGINE
// ════════════════════════════════════════════════
var CG='#26a65b',CR='#c0392b',CGY='#888';
var CGD='rgba(38,166,91,.12)',CRD='rgba(192,57,43,.12)',CGYD='rgba(140,140,140,.1)';

function dc(x,o,c,h,l,color,w){
  w=w||14;
  var bT=Math.min(o,c),bB=Math.max(o,c),bH=Math.max(bB-bT,2);
  var f=color==='green'?CG:color==='red'?CR:CGY;
  var fd=color==='green'?CGD:color==='red'?CRD:CGYD;
  var cx=x+w/2;
  return '<rect x="'+x+'" y="'+bT+'" width="'+w+'" height="'+bH+'" rx="1.5" fill="'+f+'"/>'
        +'<rect x="'+x+'" y="'+bT+'" width="'+w+'" height="'+bH+'" rx="1.5" fill="'+fd+'"/>'
        +'<rect x="'+x+'" y="'+bT+'" width="'+w+'" height="'+bH+'" rx="1.5" fill="none" stroke="'+f+'" stroke-width="1.5"/>'
        +'<line x1="'+cx+'" y1="'+h+'" x2="'+cx+'" y2="'+bT+'" stroke="'+f+'" stroke-width="1.5"/>'
        +'<line x1="'+cx+'" y1="'+bB+'" x2="'+cx+'" y2="'+l+'" stroke="'+f+'" stroke-width="1.5"/>';
}
function svgW(inner,vw,vh){
  var g='';for(var i=1;i<4;i++)g+='<line x1="0" y1="'+Math.round(vh*i/4)+'" x2="'+vw+'" y2="'+Math.round(vh*i/4)+'" stroke="rgba(0,0,0,.04)" stroke-width=".5"/>';
  return '<svg viewBox="0 0 '+vw+' '+vh+'" width="'+vw+'" height="'+vh+'" xmlns="http://www.w3.org/2000/svg">'+g+inner+'</svg>';
}
function arr(x,y,d){
  if(d==='up') return '<polygon points="'+x+','+(y-6)+' '+(x-4)+','+(y+2)+' '+(x+4)+','+(y+2)+'" fill="'+CG+'" opacity=".8"/>';
  return '<polygon points="'+x+','+(y+6)+' '+(x-4)+','+(y-2)+' '+(x+4)+','+(y-2)+'" fill="'+CR+'" opacity=".8"/>';
}

// ════════════════════════════════════════════════
//  ANATOMY DATA
// ════════════════════════════════════════════════
var PARTS = [
  {
    id:'high', label:'High 高値', jp:'高値（たかね）',
    color:'#185FA5',
    en:'The HIGHEST price reached during the entire trading session — shown as the top of the upper wick (shadow). This is the maximum price any buyer was willing to pay during the day.',
    mm:'取引セッション全体で到達した最高価格 — 上ヒゲ（シャドウ）の先端として表示される。その日に買い手が支払う意思のあった最高価格。',
    tip:'If there is no upper wick — the candle opened or closed at the highest price. This means buyers were in full control at the top.',
  },
  {
    id:'low', label:'Low 安値', jp:'安値（やすね）',
    color:'#A32D2D',
    en:'The LOWEST price reached during the trading session — shown as the bottom of the lower wick (shadow). This is the minimum price any seller was willing to accept during the day.',
    mm:'取引セッション全体で到達した最低価格 — 下ヒゲ（シャドウ）の先端として表示される。その日に売り手が受け入れる意思のあった最低価格。',
    tip:'A very long lower wick means sellers pushed price down hard but buyers recovered it. The longer the lower wick, the stronger the buyer rejection of lower prices.',
  },
  {
    id:'open', label:'Open 始値', jp:'始値（はじめね）',
    color:'#854F0B',
    en:'The FIRST price at which the stock traded when the market opened. For a bullish (green) candle the open is at the BOTTOM of the body. For a bearish (red) candle the open is at the TOP of the body.',
    mm:'市場が開いたときに株が最初に取引された価格。陽線（緑）では始値はボディの下端。陰線（赤）では始値はボディの上端。',
    tip:'Gap up open — today\'s open is higher than yesterday\'s close. Gap down open — today\'s open is lower than yesterday\'s close. Both are important signals.',
  },
  {
    id:'close', label:'Close 終値', jp:'終値（おわりね）',
    color:'#3B6D11',
    en:'The LAST price at which the stock traded before the market closed. For a bullish (green) candle the close is at the TOP of the body. For a bearish (red) candle the close is at the BOTTOM of the body.',
    mm:'市場が閉じる前に株が最後に取引された価格。陽線（緑）では終値はボディの上端。陰線（赤）では終値はボディの下端。',
    tip:'The close is the most important price — it is the consensus value the market agreed on at the end of the day. It determines whether the candle is bullish or bearish.',
  },
  {
    id:'body', label:'Body 実体', jp:'実体（じったい）',
    color:'#534AB7',
    en:'The rectangular block between the open and close prices. The SIZE of the body shows conviction — a large body means strong momentum in one direction. A small body (like a Doji) means indecision. Green body = close > open (buyers won). Red body = close < open (sellers won).',
    mm:'始値と終値の間の長方形のブロック。ボディのサイズは確信度を示す — 大きなボディは一方向への強いモメンタムを意味する。小さなボディ（ドージなど）は優柔不断を意味する。',
    tip:'Body length relative to the total candle length is key. A large body with small wicks = strong conviction. A small body with large wicks = indecision and potential reversal.',
  },
  {
    id:'upper_wick', label:'Upper Wick 上ヒゲ', jp:'上ヒゲ（かみひげ）',
    color:'#185FA5',
    en:'The thin line above the body, from the top of the body to the High price. Shows how far above the body price was pushed during the session — but then fell back. A long upper wick = buyers pushed price up but sellers rejected those higher prices.',
    mm:'ボディの上にある細い線で、ボディの上端から高値まで。セッション中にボディより上にどれだけ価格が押し上げられたかを示す。長い上ヒゲ = 買い手が価格を押し上げたが売り手が高値を拒否した。',
    tip:'Upper wick = rejected buyers. The longer the upper wick, the stronger the seller resistance at higher prices. This is the anatomy behind the Shooting Star pattern.',
  },
  {
    id:'lower_wick', label:'Lower Wick 下ヒゲ', jp:'下ヒゲ（したひげ）',
    color:'#3B6D11',
    en:'The thin line below the body, from the bottom of the body to the Low price. Shows how far below the body price was pushed — but then recovered. A long lower wick = sellers pushed price down but buyers stepped in and pushed it back up.',
    mm:'ボディの下にある細い線で、ボディの下端から安値まで。ボディより下にどれだけ価格が押し下げられたかを示す。長い下ヒゲ = 売り手が価格を押し下げたが買い手が介入して押し返した。',
    tip:'Lower wick = rejected sellers. The longer the lower wick, the stronger the buyer support at lower prices. This is the anatomy behind the Hammer pattern.',
  },
];

// ════════════════════════════════════════════════
//  ANATOMY STATE
// ════════════════════════════════════════════════
var A = { type:'bull', activePart:null };

// Candle dimensions for anatomy diagram
var AW=220, AH=320;
var BULL = { high:30, open:220, close:100, low:290, color:'green' };
var BEAR = { high:30, open:100, close:220, low:290, color:'red'   };

function getCandleDef(){ return A.type==='bull'?BULL:BEAR; }

function buildAnatomySVG(){
  var cd = getCandleDef();
  var cxLeft = 90, cw = 40;
  var cx = cxLeft + cw/2;
  var bT = Math.min(cd.open,cd.close);
  var bB = Math.max(cd.open,cd.close);
  var col = cd.color==='green'?CG:CR;
  var colDim = cd.color==='green'?CGD:CRD;
  var ap = A.activePart;

  function highlight(partId){
    return ap===partId?'rgba(255,200,0,0.25)':'transparent';
  }
  function strokeH(partId){
    return ap===partId?'rgba(200,150,0,0.6)':'none';
  }

  // Label positions
  var labelR = cxLeft+cw+14;
  var dotR   = cxLeft+cw+8;

  function partColor(id){
    var p=PARTS.find(function(x){return x.id===id;});
    return p?p.color:'#888';
  }
  function labelLine(fromX,fromY,toX,toY,id){
    var pc=partColor(id);
    var active=ap===id;
    return '<line x1="'+fromX+'" y1="'+fromY+'" x2="'+toX+'" y2="'+toY+'"'
          +' stroke="'+(active?pc:'rgba(0,0,0,0.18)')+'"'
          +' stroke-width="'+(active?1.5:1)+'" stroke-dasharray="3,2"/>';
  }
  function labelText(x,y,txt,id){
    var pc=partColor(id);
    var active=ap===id;
    return '<text x="'+x+'" y="'+y+'"'
          +' fill="'+(active?pc:'rgba(0,0,0,0.45)')+'"'
          +' font-size="'+(active?9.5:9)+'"'
          +' font-weight="'+(active?700:400)+'"'
          +' font-family="system-ui,sans-serif">'+txt+'</text>';
  }

  // Open/close label y positions
  var openLabelY   = A.type==='bull'? bB+4  : bT-8;
  var closeLabelY  = A.type==='bull'? bT-8  : bB+4;
  var openLineY    = A.type==='bull'? bB     : bT;
  var closeLineY   = A.type==='bull'? bT     : bB;

  var inner =
    // Grid lines
    '<line x1="0" y1="'+(AH*.25)+'" x2="'+AW+'" y2="'+(AH*.25)+'" stroke="rgba(0,0,0,0.04)" stroke-width="0.5"/>'
   +'<line x1="0" y1="'+(AH*.5)+'"  x2="'+AW+'" y2="'+(AH*.5)+'"  stroke="rgba(0,0,0,0.04)" stroke-width="0.5"/>'
   +'<line x1="0" y1="'+(AH*.75)+'" x2="'+AW+'" y2="'+(AH*.75)+'" stroke="rgba(0,0,0,0.04)" stroke-width="0.5"/>'

    // Candle wicks
   +'<line x1="'+cx+'" y1="'+cd.high+'" x2="'+cx+'" y2="'+bT+'" stroke="'+col+'" stroke-width="2" stroke-linecap="round"/>'
   +'<line x1="'+cx+'" y1="'+bB+'"    x2="'+cx+'" y2="'+cd.low+'" stroke="'+col+'" stroke-width="2" stroke-linecap="round"/>'

    // Candle body
   +'<rect x="'+cxLeft+'" y="'+bT+'" width="'+cw+'" height="'+(bB-bT)+'" rx="2" fill="'+col+'" opacity=".9"/>'
   +'<rect x="'+cxLeft+'" y="'+bT+'" width="'+cw+'" height="'+(bB-bT)+'" rx="2" fill="'+colDim+'"/>'
   +'<rect x="'+cxLeft+'" y="'+bT+'" width="'+cw+'" height="'+(bB-bT)+'" rx="2" fill="none" stroke="'+col+'" stroke-width="1.5"/>'

    // Hit areas (invisible, clickable)
   +'<rect x="'+(cx-22)+'" y="'+(cd.high-12)+'" width="44" height="'+(bT-cd.high+12)+'" fill="'+highlight('upper_wick')+'" stroke="'+strokeH('upper_wick')+'" stroke-width="1" rx="3" onclick="clickPart(\'upper_wick\')" style="cursor:pointer;"/>'
   +'<rect x="'+(cx-22)+'" y="'+bB+'" width="44" height="'+(cd.low-bB+12)+'" fill="'+highlight('lower_wick')+'" stroke="'+strokeH('lower_wick')+'" stroke-width="1" rx="3" onclick="clickPart(\'lower_wick\')" style="cursor:pointer;"/>'
   +'<rect x="'+(cxLeft-6)+'" y="'+bT+'" width="'+(cw+12)+'" height="'+(bB-bT)+'" fill="'+highlight('body')+'" stroke="'+strokeH('body')+'" stroke-width="1.5" rx="3" onclick="clickPart(\'body\')" style="cursor:pointer;"/>'
   +'<rect x="'+(cx-22)+'" y="'+(cd.high-14)+'" width="44" height="24" fill="'+highlight('high')+'" stroke="'+strokeH('high')+'" stroke-width="1" rx="3" onclick="clickPart(\'high\')" style="cursor:pointer;"/>'
   +'<rect x="'+(cx-22)+'" y="'+(cd.low-10)+'" width="44" height="24" fill="'+highlight('low')+'"  stroke="'+strokeH('low')+'"  stroke-width="1" rx="3" onclick="clickPart(\'low\')"  style="cursor:pointer;"/>'
   +'<circle cx="'+dotR+'" cy="'+openLineY+'"  r="8" fill="'+(ap==='open'?partColor('open'):'rgba(0,0,0,0.15)')+'"  stroke="'+(ap==='open'?partColor('open'):'none')+'"  stroke-width="1.5" onclick="clickPart(\'open\')"  style="cursor:pointer;"/>'
   +'<circle cx="'+dotR+'" cy="'+closeLineY+'" r="8" fill="'+(ap==='close'?partColor('close'):'rgba(0,0,0,0.15)')+'" stroke="'+(ap==='close'?partColor('close'):'none')+'" stroke-width="1.5" onclick="clickPart(\'close\')" style="cursor:pointer;"/>'

    // Labels — right side
   +labelLine(dotR,cd.high,     labelR,cd.high,      'high')
   +labelLine(dotR,cd.low,      labelR,cd.low,       'low')
   +labelLine(dotR,openLineY,   labelR+30,openLabelY, 'open')
   +labelLine(dotR,closeLineY,  labelR+30,closeLabelY,'close')

   +labelText(labelR+2,cd.high-3,  'High 高値',   'high')
   +labelText(labelR+2,cd.low+9,   'Low 安値',    'low')
   +labelText(labelR+32,openLabelY+4,  'Open 始値','open')
   +labelText(labelR+32,closeLabelY+4, 'Close 終値','close')

    // Labels — left side (wick labels)
   +'<text x="'+(cxLeft-8)+'" y="'+(cd.high+(bT-cd.high)/2+4)+'" fill="'+(ap==='upper_wick'?partColor('upper_wick'):'rgba(0,0,0,0.35)')+'" font-size="8" text-anchor="end" font-family="system-ui,sans-serif">Upper</text>'
   +'<text x="'+(cxLeft-8)+'" y="'+(cd.high+(bT-cd.high)/2+13)+'" fill="'+(ap==='upper_wick'?partColor('upper_wick'):'rgba(0,0,0,0.35)')+'" font-size="8" text-anchor="end" font-family="system-ui,sans-serif">wick</text>'
   +'<text x="'+(cxLeft-8)+'" y="'+(bB+(cd.low-bB)/2+4)+'" fill="'+(ap==='lower_wick'?partColor('lower_wick'):'rgba(0,0,0,0.35)')+'" font-size="8" text-anchor="end" font-family="system-ui,sans-serif">Lower</text>'
   +'<text x="'+(cxLeft-8)+'" y="'+(bB+(cd.low-bB)/2+13)+'" fill="'+(ap==='lower_wick'?partColor('lower_wick'):'rgba(0,0,0,0.35)')+'" font-size="8" text-anchor="end" font-family="system-ui,sans-serif">wick</text>'

    // Body center label
   +'<text x="'+cx+'" y="'+(bT+(bB-bT)/2+4)+'" fill="'+colDim.replace('0.12','0.9')+'" font-size="9" text-anchor="middle" font-weight="600" font-family="system-ui,sans-serif">BODY</text>'

    // High / low dot markers
   +'<circle cx="'+cx+'" cy="'+cd.high+'" r="3" fill="'+(ap==='high'?partColor('high'):col)+'" opacity=".9"/>'
   +'<circle cx="'+cx+'" cy="'+cd.low+'"  r="3" fill="'+(ap==='low'?partColor('low'):col)+'"  opacity=".9"/>';

  return '<svg viewBox="0 0 '+AW+' '+AH+'" width="'+AW+'" height="'+AH+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';
}

function clickPart(id){
  A.activePart = A.activePart===id ? null : id;
  renderAnatomy();
  if(A.activePart) showPartInfo(A.activePart);
  else hidePartInfo();
}

function showPartInfo(id){
  var p = PARTS.find(function(x){return x.id===id;});
  if(!p) return;
  document.getElementById('pip-idle').style.display='none';
  var pc = document.getElementById('pip-content');
  pc.className='pip-content show';
  document.getElementById('pip-name').textContent = p.label;
  document.getElementById('pip-name').style.color = p.color;
  document.getElementById('pip-jp').textContent = p.jp;
  document.getElementById('pip-en').textContent = p.en;
  document.getElementById('pip-mm').textContent = p.mm;
  document.getElementById('pip-tip').textContent = '💡 '+p.tip;
  // highlight pill
  document.querySelectorAll('.pp').forEach(function(b){
    b.classList.toggle('active', b.dataset.part===id);
    b.style.background = b.dataset.part===id?p.color+('22'):'';
    b.style.color = b.dataset.part===id?p.color:'';
    b.style.borderColor = b.dataset.part===id?p.color:'';
  });
}

function hidePartInfo(){
  document.getElementById('pip-idle').style.display='';
  document.getElementById('pip-content').className='pip-content';
  document.querySelectorAll('.pp').forEach(function(b){
    b.classList.remove('active');
    b.style.background=''; b.style.color=''; b.style.borderColor='';
  });
}

function renderAnatomy(){
  document.getElementById('anatomy-svg-wrap').innerHTML = buildAnatomySVG();
}

function setCandleType(t){
  A.type=t; A.activePart=null;
  document.getElementById('btn-bull').className='ct-btn bull'+(t==='bull'?' active':'');
  document.getElementById('btn-bear').className='ct-btn bear'+(t==='bear'?' active':'');
  renderAnatomy();
  hidePartInfo();
}

function buildPartPills(){
  var html='';
  PARTS.forEach(function(p){
    html+='<div class="pp" data-part="'+p.id+'" onclick="clickPart(\''+p.id+'\')" style="">'+p.label+'</div>';
  });
  document.getElementById('part-pills').innerHTML=html;
}

// ════════════════════════════════════════════════
//  PATTERN GALLERY STATE
// ════════════════════════════════════════════════
var P = {
  filter:'all',
  openId:null,
  learned: JSON.parse(localStorage.getItem('cg_learned_'+(localStorage.getItem('slp_uid')||'guest'))||'{}'),
  userId: localStorage.getItem('slp_uid')||'guest',
};
function saveP(){localStorage.setItem('cg_learned_'+P.userId,JSON.stringify(P.learned));}

var PGROUPS=[
  {label:'Single candle',items:null,candles:1},
  {label:'Two candles',items:null,candles:2},
  {label:'Three candles',items:null,candles:3},
];

function getFilteredPats(){
  var c=CANDLES;
  var f=P.filter;
  if(f==='all') return c;
  if(f==='bullish'||f==='bearish'||f==='neutral') return c.filter(function(x){return x.type===f;});
  return c.filter(function(x){return x.signal===f;});
}

function setPatFilter(f,btn){
  P.filter=f; P.openId=null;
  document.querySelectorAll('.gfb').forEach(function(b){b.className='gfb';});
  var map={all:'fa',bullish:'fbull',bearish:'fbear',neutral:'fneutral',reversal:'fa',continuation:'fa'};
  if(btn) btn.className='gfb '+(map[f]||'fa');
  renderPatterns();
}

function renderPatterns(){
  var fc=getFilteredPats();
  var groups=[
    {label:'Single candle',items:fc.filter(function(p){return p.candles===1;})},
    {label:'Two candles',  items:fc.filter(function(p){return p.candles===2;})},
    {label:'Three candles',items:fc.filter(function(p){return p.candles>=3;})},
  ].filter(function(g){return g.items.length;});

  var html='';
  groups.forEach(function(g,gi){
    html+='<div class="sec-lbl">'+g.label+' ('+g.items.length+')</div>';
    html+='<div class="pat-drawer" id="pd-'+gi+'"></div>';
    html+='<div class="pat-grid">';
    g.items.forEach(function(p){
      var isL=!!P.learned[p.id];
      var tc=p.type==='bullish'?'bull':p.type==='bearish'?'bear':'neutral';
      var selC=p.type==='bullish'?'var(--g)':p.type==='bearish'?'var(--r)':'var(--a)';
      var sel=P.openId===p.id?'selected':'';
      var pb=p.type==='bullish'?'background:var(--g-bg);color:var(--g-t)':p.type==='bearish'?'background:var(--r-bg);color:var(--r-t)':'background:var(--a-bg);color:var(--a-t)';
      html+='<div class="pat-card '+tc+' '+sel+'" id="pcc-'+p.id+'" onclick="openPatDrawer(\''+p.id+'\','+gi+')" style="--pc-sel:'+selC+';">'
          +'<div class="pc-svg">'+p.svg(0.82)+'</div>'
          +'<div class="pc-info">'
          +  '<div class="pc-badges"><span class="pcb" style="'+pb+'">'+p.type+'</span></div>'
          +  '<div class="pc-en">'+p.en+'</div>'
          +  '<div class="pc-jp">'+p.jp+'</div>'
          +  '<div class="pc-lrn '+(isL?'show':'')+'" >✓ learned</div>'
          +'</div>'
          +'</div>';
    });
    html+='</div>';
  });
  document.getElementById('patterns-body').innerHTML=html;
}

function openPatDrawer(id,gi){
  var p=CANDLES.find(function(x){return x.id===id;});
  if(!p) return;
  if(P.openId===id){P.openId=null;closePatDrawers();document.querySelectorAll('.pat-card').forEach(function(c){c.classList.remove('selected');});return;}
  P.openId=id;
  closePatDrawers();
  document.querySelectorAll('.pat-card').forEach(function(c){c.classList.remove('selected');});
  var card=document.getElementById('pcc-'+id);
  if(card) card.classList.add('selected');
  var isL=!!P.learned[id];
  var sc=p.type==='bullish'?'var(--g)':p.type==='bearish'?'var(--r)':'var(--a)';
  var pb=p.type==='bullish'?'background:var(--g-bg);color:var(--g-t)':p.type==='bearish'?'background:var(--r-bg);color:var(--r-t)':'background:var(--a-bg);color:var(--a-t)';
  var sb=p.signal==='reversal'?'background:var(--b-bg);color:var(--b-t)':'background:var(--bg);color:var(--text3)';
  var bigSvg=p.svg(1.35);
  var drawer=document.getElementById('pd-'+gi);
  if(!drawer) return;
  drawer.innerHTML=
    '<div class="pdw-vis">'+bigSvg+'<div class="pdw-vis-lbl">'+p.jp+'</div></div>'
   +'<div class="pdw-body">'
   +  '<button class="pdw-close" onclick="closePatDrawers(event)" aria-label="Close"><i class="ti ti-x"></i></button>'
   +  '<div class="pdw-jp">'+p.jp+'</div>'
   +  '<div class="pdw-en" style="color:'+sc+'">'+p.en+'</div>'
   +  '<div class="pdw-mm">'+p.mm+'</div>'
   +  '<div class="pdw-badges"><span class="pcb" style="'+pb+'">'+p.type+'</span><span class="pcb" style="'+sb+'">'+p.signal+'</span><span class="pcb" style="background:var(--bg);color:var(--text3);">'+p.diff+'</span></div>'
   +  '<div class="pdw-lbl">Explanation</div>'
   +  '<div class="pdw-exp">'+p.exp_en+'</div>'
   +  '<div class="pdw-exp-mm">'+p.exp_mm+'</div>'
   +  '<div class="pdw-tip">'+p.tip_en+'</div>'
   +  '<div class="pdw-tip-mm">'+p.tip_mm+'</div>'
   +  '<button class="mark-btn '+(isL?'on':'')+'" onclick="togglePatLearned(event,\''+id+'\')">'
   +    '<i class="ti '+(isL?'ti-circle-check':'ti-circle')+'" style="font-size:14px;" aria-hidden="true"></i>'
   +    (isL?'Learned':'Mark as learned')
   +  '</button>'
   +'</div>';
  drawer.className='pat-drawer open';
  drawer.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closePatDrawers(e){
  if(e) e.stopPropagation();
  P.openId=null;
  document.querySelectorAll('.pat-drawer').forEach(function(d){d.className='pat-drawer';d.innerHTML='';});
  document.querySelectorAll('.pat-card').forEach(function(c){c.classList.remove('selected');});
}

function togglePatLearned(e,id){
  e.stopPropagation();
  P.learned[id]=!P.learned[id];
  saveP();
  renderPatterns();
  var p=CANDLES.find(function(x){return x.id===id;});
  if(p){
    var fc=getFilteredPats();
    var groups=[fc.filter(function(x){return x.candles===1;}),fc.filter(function(x){return x.candles===2;}),fc.filter(function(x){return x.candles>=3;})].filter(function(g){return g.length;});
    var gi=groups.findIndex(function(g){return g.find(function(x){return x.id===id;});});
    if(gi>=0) setTimeout(function(){openPatDrawer(id,gi);},40);
  }
}

// ════════════════════════════════════════════════
//  TABS
// ════════════════════════════════════════════════
function switchTab(tab, el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.tab-page').forEach(function(p){p.classList.remove('active');});
  if(el) el.classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
}

//  INIT
// ════════════════════════════════════════════════
renderAnatomy();
buildPartPills();
renderPatterns();
